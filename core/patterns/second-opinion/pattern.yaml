# Second opinion (Checking the work, rung 8). Full definition: definition.md.
#
# Disabled: the intended detection combines model judgement (was the review
# independent and, for later stages, were its findings used) with review provenance (which session
# or agent reviewed, and whether it wrote the change). The pinned CLI runs no
# pack-authored judge and no block that sees reviewer provenance, so no
# detection, applies_to or mechanism block is named here. judge.md is
# authoring prose only.
id: glenngillen/second-opinion
version: 1
status: preview
group: checking-the-work
rung: 8
enabled: false
opportunities: true

seen:
  when: >
    Before accepting a change that was committed or opened as a pull request,
    the person requested or ran an independent review (their own review agent
    or command, a built-in review command, a different model, or a fresh
    session that did not write the code) and the review returned its result.
    Seen completes on the review request with its result. Acting on the
    findings, or accepting an evidenced clean result, is follow-through
    counted only for Forming and Established; ignored findings are failed
    follow-through that never counts toward later stages but does not
    withdraw Seen. Asking the implementing session "is this right?" does not
    count.

continuous:
  held:
    applies_when: >
      The person's agent changes are committed or opened as pull requests in
      the window.
    holds_when: >
      An automated independent review (a hook, CI job or pull request
      mechanism) actually ran on the person's changes and its findings were
      used before the changes were accepted.
    not_holding_when: >
      A change was accepted without the automated review running, or with its
      findings ignored, while the mechanism was in place.

automate: >
  Have an independent review run automatically on your changes, from a hook,
  CI job or pull request reviewer you own, so every change gets a second
  opinion. This is a later step, offered once several patterns already happen
  on their own; it does not replace reading and acting on the findings.

# The eight groups in catalogue order. Each group's patterns are listed in
# rung order, foundational first, as they are authored; a group with no
# authored pattern yet has no patterns list.
groups:
  - id: briefing
    name: Briefing
    description: >
      The person as the agent's guide for each piece of work: what to do,
      what done means, and how to get there. Without acceptance criteria,
      correctness is outside anything that checks the work.
    patterns:
      - brief-it
      - define-done
      - plan-first
      - own-the-expectations
  - id: guides
    name: Guides
    description: >
      What the agent knows before it starts: instructions, conventions, saved
      workflows and tools. Guides are how one correction becomes permanent.
    patterns:
      - give-it-instructions
      - write-it-down
      - keep-it-lean
      - save-it
      - script-it
      - reuse-your-harness
      - fix-the-harness
  - id: context
    name: Context
    description: >
      What's in the agent's working memory during a session. Keeping it
      relevant keeps the agent sharp and cheap.
    patterns:
      - clear-between-tasks
      - hand-it-off
      - point-dont-paste
  - id: checking-the-work
    name: Checking the work
    description: >
      How the work gets checked, and where checks are enforced: from the
      person checking, to the agent running checks, to checks that block it
      at each step and before "done", to CI, independent reviews and checks
      that keep running after the work ships. Quality is kept as early as
      possible.
    patterns:
      - prove-it
      - evidence-not-claims
      - checks-by-default
      - actionable-failures
      - gate-done
      - gate-each-step
      - back-it-up-in-ci
      - second-opinion
      - test-behaviour
      - schedule-the-clean-up
      - learn-from-production
  - id: correcting-course
    name: Correcting course
    description: >
      Correcting the agent while the work is under way: redirecting it when
      it goes wrong, and setting checkpoints ahead of time so it stops and
      asks. Making a correction permanent is Fix the harness, in Guides.
    patterns:
      - steer
      - set-checkpoints
  - id: delegation
    name: Delegation
    description: >
      Handing the agent work at the right size and letting it run:
      subagents, unattended runs, isolation, parallel sessions. These pay off
      most once Checking the work is in place.
    patterns:
      - size-it
      - split-it-up
      - fan-out
      - hands-off
      - isolate-the-run
      - two-at-once
  - id: economics
    name: Economics
    description: >
      Getting the same results for less: the right model for the task, the
      harness doing the work a bigger model would, and context that stays
      cached.
    patterns:
      - right-size-it
      - mind-the-cache
      - harness-carries-it
      - right-cadence
  - id: safety
    name: Safety
    description: >
      Giving the agent autonomy in proportion to what it could break. These
      advance alongside Delegation: next steps don't suggest more autonomy
      without them.
    patterns:
      - keep-secrets-out
      - scope-permissions
      - guard-destructive
      - sandbox-autonomy
